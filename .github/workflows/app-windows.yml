name: App Windows
run-name: App Windows / ${{ github.event_name == 'push' && github.ref_name || inputs.source_ref }} / ${{ inputs.task || 'installer' }}

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      source_ref:
        description: GeoPlatform-App source branch
        type: choice
        default: "feature/gplatform-ui"
        options:
          # branches:source_ref:begin
          - "ci/app-workflows"
          - "ci/delivery/40620850664-1"
          - "ci/delivery/40919516847-1"
          - "ci/installers-20261030"
          - "ci/macos-status"
          - "ci/validation-20261030"
          - "ci/windows-source-cache"
          - "feature/gplatform-ui"
          - "main"
          # branches:source_ref:end
      sdk_ref:
        description: SDK branch (must match the selected App and source dependencies)
        type: choice
        default: "Use repository pin"
        options:
          # branches:sdk_ref:begin
          - "Use repository pin"
          - "ci/delivery/40620850664-1"
          - "ci/delivery/40868656517-1"
          - "ci/delivery/40890497656-1"
          - "ci/delivery/40916633054-1"
          - "ci/delivery/40919516847-1"
          - "ci/validation-20261030"
          - "feature/gplatform-ui"
          - "main"
          # branches:sdk_ref:end
      orca_ref:
        description: OrcaSlicer branch
        type: choice
        default: "Use repository pin"
        options:
          # branches:orca_ref:begin
          - "Use repository pin"
          - "FullSpectrum_integration"
          - "belt-printer"
          - "feat/snap-store-packaging"
          - "feature/auto-update"
          - "feature/automation"
          - "feature/cache_profiles_and_optimize_loading_speed"
          - "feature/continuous-fiber"
          - "feature/continuous-fiber-v2"
          - "feature/gplatform-libslicer-integration"
          - "feature/protobuf_config_and_dynamic_ui"
          - "fix/cli-segfault"
          - "fix/duplicated_eye_for_password_on_login_register_page"
          - "fix/linux-webview-amd-perf"
          - "fix/optimize_window_event_handler_for_mouse_events"
          - "fix/type-rename-in-presetbundledialog"
          - "fix/windows-import-and-solid-infill"
          - "libslicer"
          - "main"
          - "release/signpath-test"
          - "release/v1.8"
          - "release/v1.9"
          - "release/v2.3"
          - "release/v2.3.1"
          - "release/v2.4"
          # branches:orca_ref:end
      smoothui_ref:
        description: SmoothUI branch
        type: choice
        default: "Use repository pin"
        options:
          # branches:smoothui_ref:begin
          - "Use repository pin"
          - "dev"
          - "feature/gplatform-ui"
          - "source"
          # branches:smoothui_ref:end
      dock_ref:
        description: SmoothUIDock branch
        type: choice
        default: "Use repository pin"
        options:
          # branches:dock_ref:begin
          - "Use repository pin"
          - "dev"
          - "feature/gplatform-ui"
          - "fix/sdk-packaging-restart"
          - "source"
          # branches:dock_ref:end
      task:
        description: Build and package the App, or compile and test only
        type: choice
        options: [installer, build]
        default: installer
      dependencies:
        description: Recorded source submodules or configured source fork branch tips; SDK stays pinned unless selected above
        type: choice
        options: [locked, latest]
        default: locked
      delivery:
        description: Actions download or an immutable Release in this App repository
        type: choice
        options: [artifacts, release]
        default: artifacts
      version:
        description: Required for Release; must match the existing App version
        type: string
        default: ''
      clean_build:
        description: Rebuild this App configuration; preserve compatible dependency caches
        type: boolean
        default: false
      resume_run:
        description: Resume an existing installer upload or Release; ignore build selections
        type: string
        default: ''
permissions:
  contents: read

jobs:
  changes:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.diff.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify CI contracts
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Check actual changed content
        id: diff
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/change_detection.py --repo "$GITHUB_WORKSPACE"

  build:
    needs: changes
    if: needs.changes.outputs.build_required == 'true'
    runs-on: [self-hosted, Windows, X64, gplatform-build]
    timeout-minutes: 1440
    permissions:
      contents: write
    env:
      GP_APP_CI_ROOT: ${{ vars.GPLATFORM_APP_WINDOWS_CI_ROOT }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
      GCM_INTERACTIVE: never
      GIT_HTTP_LOW_SPEED_LIMIT: '16384'
      GIT_HTTP_LOW_SPEED_TIME: '60'
      GIT_CONFIG_COUNT: '3'
      GIT_CONFIG_KEY_0: http.sslBackend
      GIT_CONFIG_VALUE_0: openssl
      GIT_CONFIG_KEY_1: http.version
      GIT_CONFIG_VALUE_1: HTTP/1.1
      GIT_CONFIG_KEY_2: core.autocrlf
      GIT_CONFIG_VALUE_2: 'true'
      SOURCE_TOKEN: ${{ secrets.GPLATFORM_SOURCE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      INPUT_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.source_ref }}
      INPUT_TASK: ${{ inputs.task || 'installer' }}
      INPUT_DEPENDENCIES: ${{ inputs.dependencies || 'locked' }}
      INPUT_SDK_REF: ${{ inputs.sdk_ref }}
      INPUT_ORCA_REF: ${{ inputs.orca_ref }}
      INPUT_SMOOTHUI_REF: ${{ inputs.smoothui_ref }}
      INPUT_DOCK_REF: ${{ inputs.dock_ref }}
      INPUT_DELIVERY: ${{ inputs.delivery || 'artifacts' }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_CLEAN: ${{ inputs.clean_build }}
      INPUT_RESUME: ${{ inputs.resume_run }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out App orchestration
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: automation
          persist-credentials: false
      - name: Prepare App run
        run: |
          python "$env:GITHUB_WORKSPACE/automation/scripts/ci/app_build.py" prepare --platform windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check out selected App sources
        timeout-minutes: 15
        if: inputs.resume_run == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
          path: source
          fetch-depth: 0
          token: ${{ secrets.GPLATFORM_SOURCE_TOKEN || github.token }}
          persist-credentials: false
          submodules: false
      - name: Build App against the selected SDK and run consumer checks
        if: inputs.resume_run == ''
        run: |
          python "$env:GITHUB_WORKSPACE/automation/scripts/ci/app_build.py" build --config "$env:GP_APP_CI_ROOT/config/machine.json" --source "$env:GITHUB_WORKSPACE/source" --run-dir "$env:GP_RUN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish or resume App Release
        if: env.GP_DELIVERY == 'release'
        timeout-minutes: 45
        run: |
          python "$env:GITHUB_WORKSPACE/automation/scripts/ci/app_release.py" --run-dir "$env:GP_RUN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare installer and checksum download
        id: download
        run: |
          python "$env:GITHUB_WORKSPACE/automation/scripts/ci/app_build.py" download --run-dir "$env:GP_RUN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare upload runtime
        if: steps.download.outputs.ready == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install and verify the pinned upload client
        if: steps.download.outputs.ready == 'true'
        env:
          NPM_CONFIG_FETCH_RETRIES: '5'
        run: |
          npm ci --prefix "$env:GITHUB_WORKSPACE/automation/scripts/ci/artifact-upload" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "$env:GP_RUN/logs" | Out-Null
          node --test "$env:GITHUB_WORKSPACE/automation/scripts/ci/artifact-upload/test-retry.cjs" > "$env:GP_RUN/logs/artifact-client-tests.log" 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer and checksum only
        if: steps.download.outputs.ready == 'true'
        timeout-minutes: 45
        uses: ./automation/scripts/ci/artifact-upload
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: '6'
          ACTIONS_ARTIFACT_UPLOAD_TIMEOUT_MS: '180000'
        with:
          name: app-windows-${{ github.run_id }}-${{ github.run_attempt }}
          root-directory: ${{ env.GP_RUN }}/download
          path: |
            ${{ env.GP_RUN }}/download/*.exe
            ${{ env.GP_RUN }}/download/checksums.sha256
          retention-days: '30'

  refresh-branches:
    needs: [changes, build]
    if: always() && !cancelled() && needs.changes.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: app-branch-dropdowns
      cancel-in-progress: false
    steps:
      - name: Check out current App default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Refresh both platform branch menus
        env:
          SOURCE_TOKEN: ${{ secrets.GPLATFORM_SOURCE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_TOKEN: ${{ secrets.GPLATFORM_WORKFLOW_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/ci/refresh_branches.py --repository "$GITHUB_REPOSITORY" --push
