name: MR Checks
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
permissions:
  contents: read
jobs:
  ci_scripts:
    name: CI scripts (${{ matrix.os }})
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    concurrency:
      group: app-ci-scripts-${{ github.event.pull_request.number }}-${{ matrix.os }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install CI script test dependencies
        run: python -m pip install -r tests/ci/requirements.txt -r tools/requirements.txt
      - name: Run Python CI script tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests/ci -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: runner.os == 'Windows'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run runner queue tests
        if: runner.os == 'Windows'
        run: node --test tests/ci/test_ci_runner_queue.cjs
      - name: Run supplemental macOS tests
        if: runner.os == 'macOS'
        working-directory: tests/ci
        run: >-
          python -m unittest -v
          test_universal_sdk.UniversalSDKTests
          test_ci_regression.RegressionTests.test_ctest_timeout_cleans_actual_probe_subtree
          test_ci_regression.RegressionTests.test_native_ctest_uses_the_same_python_as_driver_admission
          test_ci_regression.RegressionTests.test_native_regression_uses_one_ctest_after_build
          test_build.AppSDKChecks.test_sdk_symlink_cannot_read_outside_slot
  regression:
    permissions:
      contents: read
      actions: write
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    concurrency:
      group: app-mr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/run-regression.yml
    with:
      app_ref: ${{ github.event.pull_request.head.sha }}
      app_branch: ${{ github.event.pull_request.head.ref }}
      host_ref: ${{ vars.GPLATFORM_HOST_REF || 'feature/gplatform-ui' }}
      platform: all
      macos_test_assets_ref: macmini
      windows_test_assets_ref: windows
    secrets:
      GPLATFORM_SOURCE_TOKEN: ${{ secrets.GPLATFORM_SOURCE_TOKEN }}
      GPLATFORM_WORKFLOW_TOKEN: ${{ secrets.GPLATFORM_WORKFLOW_TOKEN }}
