name: Windows CI status
run-name: Windows CI status / ${{ inputs.sdk_run }}
on:
  workflow_dispatch:
    inputs:
      sdk_run:
        description: Producer run-id-attempt to inspect (for example 40868656517-1)
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, gplatform-build]
    timeout-minutes: 5
    env:
      GP_PRODUCER_ROOT: ${{ vars.GPLATFORM_WINDOWS_PRODUCER_ROOT || 'C:/gp-ci' }}
      GP_SDK_RUN: ${{ inputs.sdk_run }}
    steps:
      - name: Read producer progress on this shared machine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GP_SDK_RUN -notmatch '^\d+-\d+$') { throw 'sdk_run must be run-id-attempt.' }
          $directory = Join-Path $env:GP_PRODUCER_ROOT "runs/$env:GP_SDK_RUN"
          $manifest = Get-Content -LiteralPath "$directory/build-manifest.json" -Raw | ConvertFrom-Json
          $manifest | Select-Object status, started_at, finished_at, error, source_path, build_directory | ConvertTo-Json -Compress | Write-Host
          Get-Process -Name cl, cmake, ninja, python, git, git-lfs, link, rc -ErrorAction SilentlyContinue | Select-Object ProcessName, Id, CPU, StartTime | ConvertTo-Json -Compress | Write-Host
          foreach ($name in @('build.log', 'package.log', 'verify-app-build.log', 'verify-sdk-check-build.log', 'verify-sdk-check.log')) {
            $path = Join-Path $directory "logs/$name"
            if (Test-Path -LiteralPath $path) {
              Get-Item -LiteralPath $path | Select-Object Name, Length, LastWriteTime | ConvertTo-Json -Compress | Write-Host
              Get-Content -LiteralPath $path -Tail 15 | ForEach-Object { $_ -replace 'https?://[^\s]+', '<url>' } | Write-Host
            }
          }
          $publication = Join-Path $directory 'publication.json'
          if (Test-Path -LiteralPath $publication) {
            Get-Content -LiteralPath $publication -Raw | ConvertFrom-Json | Select-Object phase, last_error, failed_at, source_commit, sdk_base, app_base, sdk_commit, app_commit, verified, sdk_published, app_published | ConvertTo-Json -Compress | Write-Host
          }
