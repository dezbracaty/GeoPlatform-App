name: Upload artifacts with connection retries
description: Use the official artifact client and retry interrupted control requests without reuploading content.
inputs:
  name:
    required: true
    description: Artifact name
  root-directory:
    required: true
    description: Absolute directory containing all selected files
  path:
    required: true
    description: Newline separated file patterns
  retention-days:
    default: '30'
    description: Artifact retention in days
outputs:
  artifact-id:
    description: Finalized artifact ID
  artifact-url:
    description: Browser download URL
runs:
  using: node24
  main: upload.mjs
